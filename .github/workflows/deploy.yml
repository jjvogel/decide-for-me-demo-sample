name: deploy

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # required, lets the job request an OIDC token
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest

  deploy:
    needs: test          # deploy only runs if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::638486126131:role/decide-for-me-deploy
          aws-region: us-east-1
      - name: Deploy
        run: |
          zip function.zip handler.py
          aws lambda update-function-code --function-name decide-for-me --zip-file fileb://function.zip
