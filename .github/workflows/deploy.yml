name: deploy

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # lets the workflow do the OIDC handshake with AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::638486126131:role/decide-for-me-deploy
          aws-region: us-east-1
      - name: Deploy
        run: |
          zip function.zip handler.py
          aws lambda update-function-code --function-name decide-for-me --zip-file fileb://function.zip
